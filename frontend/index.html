<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptiRoute</title>
    <!-- Runs before first paint so a saved theme (cached in localStorage by
         App.tsx once settings load) applies immediately instead of flashing
         the "light" attribute above -- see App.tsx's theme useEffect. -->
    <script>
      (function () {
        try {
          var cached = localStorage.getItem('optiroute-theme')
          if (cached === 'dark' || cached === 'light') {
            document.documentElement.dataset.theme = cached
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

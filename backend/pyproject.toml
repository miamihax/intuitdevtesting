[project]
name = "optiroute-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "pypdf>=5.0",
    "watchdog>=4.0",
    "Pillow>=10.0",
    "vercel_blob>=0.4.2",
    "requests>=2.31",
    "tqdm>=4.66",
]

[tool.vercel]
entrypoint = "api.app.main:app"
